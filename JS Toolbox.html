"slug":"data-states","ans":"จัดการ 3 กรณี: `setLoading` ใน try/finally, ตรวจ `users.length === 0` สำหรับ empty, และ catch สำหรับ error","blocks":[{"lang":"js","code":"if (users.length === 0) showEmptyState();"}]},{"q":"หลาย request ไม่ขึ้นต่อกันแต่ช้า","slug":"parallel","ans":"ส่งพร้อมกันด้วย `Promise.all` (ถ้าตัวใดตัวหนึ่งล้มเหลวทั้งก้อนล้มเหลว)","blocks":[{"lang":"js","code":"const [users, products] = await Promise.all([getUsers(), getProducts()]);"}]},{"q":"อยากได้ผลของทุก request แม้บางตัวล้มเหลว","slug":"parallel","ans":"ใช้ `Promise.allSettled` แล้วดู `status` ของแต่ละตัว","blocks":[{"lang":"js","code":"const results = await Promise.allSettled([getUsers(), getProducts()]);"}]},{"q":"ค้นหาแบบพิมพ์สดแล้วผลเก่ามาทับผลใหม่","slug":"race-abort","ans":"ยกเลิก request เก่าด้วย `AbortController` ก่อนส่งอันใหม่ และเพิกเฉย `AbortError`","blocks":[{"lang":"js","code":"controller?.abort();\ncontroller = new AbortController();"}]},{"q":"พิมพ์ทีละตัวอักษรแล้วส่ง request ถี่เกินไป","slug":"debounce","ans":"ใช้ debounce รอให้หยุดพิมพ์ชั่วครู่แล้วส่งครั้งเดียว","blocks":[{"lang":"js","code":"const handleSearch = debounce(searchProducts, 300);"}]},{"q":"ต่อ query string เองแล้วมีปัญหากับอักขระพิเศษ","slug":"url-params","ans":"ใช้ `URLSearchParams` ที่ encode ให้ถูกต้อง","blocks":[{"lang":"js","code":"const params = new URLSearchParams({ q: query, page: 1 });"}]},{"q":"ข้อมูลจาก API อาจไม่ครบหรือเป็น null","slug":"api-safety","ans":"อ่านด้วย `?.` ร่วมกับ default (`??`) และตรวจ field ที่จำเป็นแล้ว throw","blocks":[{"lang":"js","code":"data.user?.profile?.name ?? \"ไม่ระบุ\";"}]},{"q":"ปุ่มเพิ่มตัวนับ สลับ class และรีเซ็ต","slug":"hw-counter","ans":"`querySelector` จับปุ่ม, ตัวแปร `count`, `addEventListener(\"click\")`, `textContent`, `classList.toggle/remove`","blocks":[{"lang":"js","code":"btn.addEventListener(\"click\", () => { count++; box.textContent = count; });"}]},{"q":"ฟังก์ชันที่ต้องจัดรูปข้อความด้วยเงื่อนไข","slug":"hw-format","ans":"template literal ร่วมกับ ternary และเมธอดของ string","blocks":[{"lang":"js","code":"`${name.toUpperCase()} | ${score >= 50 ? \"Pass\" : \"Fail\"}`;"}]},{"q":"ต้องสร้าง object ที่มีเมธอดและเก็บสถานะ เช่น บัญชีธนาคาร","slug":"hw-bank","ans":"closure + object ของเมธอด + เงื่อนไขป้องกัน","blocks":[{"lang":"js","code":"function createBankAccount(initial) { let balance = initial; return { getBalance: () => balance }; }"}]},{"q":"จัดการรายการไม่ให้ซ้ำ","slug":"hw-items","ans":"closure เก็บ array, `includes` กันซ้ำ, `filter` ลบ, คืน `[...items]`","blocks":[{"lang":"js","code":"if (!items.includes(item)) items.push(item);"}]},{"q":"แก้ object: เพิ่ม ลบ และสร้างสำเนาที่เปลี่ยน field เดียว","slug":"hw-object-ops","ans":"assign property ใหม่, `delete`, `{ ...obj, field: newValue }`","blocks":[{"lang":"js","code":"const updated = { ...course, title: \"New title\" };"}]}]}</script>
<script>
function inspect(v, depth, seen) {
  depth = depth || 0;
  seen = seen || [];
  if (v === null) return 'null';
  var t = typeof v;
  if (t === 'string') return depth ? "'" + v.replace(/'/g, "\\'") + "'" : v;
  if (t === 'number') return Object.is(v, -0) ? '-0' : String(v);
  if (t === 'bigint') return v + 'n';
  if (t === 'function') return '[Function: ' + (v.name || 'anonymous') + ']';
  if (t === 'symbol') return v.toString();
  if (t !== 'object') return String(v);
  if (v instanceof Error) return v.name + ': ' + v.message;
  if (seen.indexOf(v) !== -1) return '[Circular]';
  if (depth > 3) return Array.isArray(v) ? '[Array]' : '[Object]';
  var s = seen.concat([v]);
  if (Array.isArray(v)) {
    return v.length ? '[ ' + v.map(function (x) { return inspect(x, depth + 1, s); }).join(', ') + ' ]' : '[]';
  }
  var keys = Object.keys(v);
  if (!keys.length) return '{}';
  return '{ ' + keys.map(function (k) {
    var name = /^[A-Za-z_$][\w$]*$/.test(k) ? k : "'" + k + "'";
    return name + ': ' + inspect(v[k], depth + 1, s);
  }).join(', ') + ' }';
}

function makeConsole(emit) {
  var log = function () {
    emit(Array.prototype.map.call(arguments, function (x) {
      return typeof x === 'string' ? x : inspect(x);
    }).join(' '));
  };
  return {
    log: log, info: log, warn: log, debug: log,
    error: function () { log.apply(null, ['Error:'].concat([].slice.call(arguments))); }
  };
}

function runCode(code, emit) {
  var AF = Object.getPrototypeOf(async function () {}).constructor;
  var fn;
  try {
    fn = new AF('console', '"use strict";\n' + code);
  } catch (e) {
    emit((e && e.name ? e.name + ': ' + e.message : String(e)));
    return Promise.resolve();
  }
  return Promise.resolve()
    .then(function () { return fn(makeConsole(emit)); })
    .catch(function (e) { emit('Uncaught ' + (e && e.name ? e.name + ': ' + e.message : String(e))); });
}

if (typeof module !== 'undefined') module.exports = { inspect: inspect, makeConsole: makeConsole, runCode: runCode };


(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var LEC = { L4: 'Lecture 4', L5: 'Lecture 5', HW: 'แบบฝึกหัด' };
  var LEADS = {
    tools: 'พิมพ์ค้นหาหรือเลือกหัวข้อจากสารบัญ กด "คัดลอก" เพื่อเอาโค้ดไปใช้ กด "รัน" เพื่อดูผลจริงของตัวอย่างที่ทดลองได้ (ตัวอย่างที่ต้องมีหน้า HTML หรือ API จริงจะไม่มีปุ่มรัน)',
    problems: 'แต่ละข้อบอกว่าถ้าเจอปัญหาแบบนี้ให้ใช้เครื่องมือตัวไหน พร้อมโค้ดสั้น ๆ และลิงก์ไปคำอธิบายเต็มของหัวข้อนั้น'
  };
  var state = { view: 'tools', lec: 'all', q: '' };
  var CODE = {};
  var index = {};

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  DATA.sections.forEach(function (sec) {
    sec.items.forEach(function (it) {
      index[it.id] = { it: it, sec: sec };
      it.hay = (it.title + ' ' + it.tags.join(' ') + ' ' + it.text + ' ' + it.blocks.map(function (b) { return b.code; }).join(' ')).toLowerCase();
    });
  });
  DATA.problems.forEach(function (p) {
    p.lec = index[p.slug].sec.lec;
    p.hay = (p.q + ' ' + p.ans + ' ' + p.blocks.map(function (b) { return b.code; }).join(' ')).toLowerCase();
  });

  /* syntax highlighting */
  var JS_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(0[xXbBoO][\da-fA-F_]+n?|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?n?)\b|\b(const|let|var|function|return|if|else|for|while|of|in|new|class|async|await|try|catch|finally|throw|typeof|delete|this)\b|\b(true|false|null|undefined|NaN|Infinity)\b/g;
  var JS_CLS = ['', 'com', 'str', 'num', 'kw', 'lit'];
  var HTML_RE = /(<!--[\s\S]*?-->)|(<\/?[A-Za-z][\w-]*)|("[^"]*")|(\/?>)/g;
  var HTML_CLS = ['', 'com', 'kw', 'str', 'kw'];

  function hl(code, lang) {
    var re, cls;
    if (lang === 'html') { re = HTML_RE; cls = HTML_CLS; }
    else if (lang === 'js') { re = JS_RE; cls = JS_CLS; }
    else return esc(code);
    re.lastIndex = 0;
    var out = '', last = 0, m;
    while ((m = re.exec(code))) {
      var g = 0;
      for (var i = 1; i < m.length; i++) { if (m[i] !== undefined) { g = i; break; } }
      out += esc(code.slice(last, m.index)) + '<span class="t-' + cls[g] + '">' + esc(m[0]) + '</span>';
      last = re.lastIndex;
    }
    return out + esc(code.slice(last));
  }

  /* prose: paragraphs, bullet lists, tables, `code`, **bold** */
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function cells(row) {
    return row.replace(/^\|/, '').replace(/\|\s*$/, '').split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, '|'); });
  }
  function table(rows) {
    var head = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    return '<div class="tablewrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>';
  }
  function prose(text) {
    var html = '', para = [], list = [], rows = [], mode = null;
    function flush() {
      if (para.length) html += '<p>' + inline(para.join(' ')) + '</p>';
      if (list.length) html += '<ul>' + list.map(function (l) { return '<li>' + inline(l) + '</li>'; }).join('') + '</ul>';
      if (rows.length) html += table(rows);
      para = []; list = []; rows = [];
    }
    text.split('\n').forEach(function (raw) {
      var l = raw.trimEnd();
      if (!l.trim()) { flush(); mode = null; return; }
      var m = l.charAt(0) === '|' ? 't' : (l.indexOf('- ') === 0 ? 'l' : 'p');
      if (m !== mode) { flush(); mode = m; }
      if (m === 't') rows.push(l);
      else if (m === 'l') list.push(l.slice(2));
      else para.push(l);
    });
    flush();
    return html;
  }

  /* views */
  function block(key, b, canRun) {
    CODE[key] = b.code;
    var run = canRun && b.run ? '<button class="btn run" type="button" data-run="' + key + '">รัน</button>' : '';
    return '<figure class="code" style="margin-inline:0"><div class="bar"><span class="lang">' + esc(b.lang) + '</span><div class="acts">' + run +
      '<button class="btn" type="button" data-copy="' + key + '">คัดลอก</button></div></div>' +
      '<pre id="c-' + key + '"><code>' + hl(b.code, b.lang) + '</code></pre>' +
      (run ? '<pre class="out" id="o-' + key + '" hidden aria-live="polite"></pre>' : '') + '</figure>';
  }

  function itemHtml(it) {
    return '<article class="item" id="i-' + it.id + '"><h3>' + esc(it.title) + '</h3>' +
      '<div class="tags">' + it.tags.map(function (t) { return '<button class="tag" type="button" data-tag="' + esc(t) + '">#' + esc(t) + '</button>'; }).join('') + '</div>' +
      '<div class="prose">' + prose(it.text) + '</div>' +
      it.blocks.map(function (b, i) { return block(it.id + '-' + i, b, true); }).join('') + '</article>';
  }

  function matches(hay, q) {
    return q.split(/\s+/).every(function (t) { return hay.indexOf(t) !== -1; });
  }

  function renderTools() {
    var q = state.q.trim().toLowerCase();
    var html = '', shown = 0;
    var toc = { L4: [], L5: [], HW: [] };
    DATA.sections.forEach(function (sec) {
      if (state.lec !== 'all' && state.lec !== sec.lec) return;
      var its = sec.items.filter(function (it) { return !q || matches(it.hay, q); });
      if (!its.length) return;
      shown += its.length;
      toc[sec.lec].push('<a href="#s-' + sec.id + '" data-go="s-' + sec.id + '">' + esc(sec.title) + ' <span>' + its.length + '</span></a>');
      html += '<section class="sec" id="s-' + sec.id + '"><header class="sec-head"><span class="badge ' + sec.lec + '">' + LEC[sec.lec] + '</span><h2>' + esc(sec.title) +
        '</h2><p>' + esc(sec.blurb) + '</p></header>' + its.map(itemHtml).join('') + '</section>';
    });
    document.getElementById('main').innerHTML = html || emptyHtml();
    document.getElementById('toc-body').innerHTML = ['L4', 'L5', 'HW'].filter(function (k) { return toc[k].length; }).map(function (k) {
      return '<div class="toc-group"><h4>' + LEC[k] + '</h4>' + toc[k].join('') + '</div>';
    }).join('');
    document.getElementById('count').textContent = 'แสดง ' + shown + ' หัวข้อ';
  }

  function renderProblems() {
    var q = state.q.trim().toLowerCase();
    var list = DATA.problems.filter(function (p) {
      return (state.lec === 'all' || state.lec === p.lec) && (!q || matches(p.hay, q));
    });
    var html = list.map(function (p, n) {
      var target = index[p.slug];
      return '<article class="prob"><div><span class="badge ' + p.lec + '">' + LEC[p.lec] + '</span><h3>' + esc(p.q) + '</h3></div><div>' +
        '<p class="ans">' + inline(p.ans) + '</p>' +
        p.blocks.map(function (b, i) { return block('p' + n + '-' + i, b, false); }).join('') +
        '<button class="jump" type="button" data-jump="' + p.slug + '">ดูคำอธิบายเต็ม: ' + esc(target.it.title) + ' →</button></div></article>';
    }).join('');
    document.getElementById('main').innerHTML = html || emptyHtml();
    document.getElementById('count').textContent = 'แสดง ' + list.length + ' โจทย์';
  }

  function emptyHtml() {
    return '<div class="empty">ไม่พบผลลัพธ์สำหรับ "' + esc(state.q) + '" ลองคำอื่น เช่น map, closure, fetch, this หรือเปลี่ยนตัวกรอง</div>';
  }

  function render() {
    var tools = state.view === 'tools';
    document.getElementById('layout').className = tools ? 'layout' : 'layout solo';
    document.getElementById('toc').hidden = !tools;
    document.getElementById('lead').textContent = LEADS[state.view];
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.view === state.view)); });
    document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.lec === state.lec)); });
    if (tools) renderTools(); else renderProblems();
  }

  /* actions */
  function flash(btn, msg) {
    var old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = old; }, 1400);
  }

  function copyCode(key, btn) {
    var text = CODE[key];
    var fallback = function () {
      var pre = document.getElementById('c-' + key);
      var r = document.createRange();
      r.selectNodeContents(pre);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      flash(btn, 'เลือกแล้ว กด Ctrl+C');
    };
    try {
      navigator.clipboard.writeText(text).then(function () { flash(btn, 'คัดลอกแล้ว'); }, fallback);
    } catch (e) { fallback(); }
  }

  function runBlock(key, btn) {
    var out = document.getElementById('o-' + key);
    var token = String((+out.dataset.token || 0) + 1);
    out.dataset.token = token;
    out.hidden = false;
    out.textContent = '';
    var lines = [];
    btn.disabled = true;
    btn.textContent = 'กำลังรัน…';
    runCode(CODE[key], function (line) {
      if (out.dataset.token !== token) return;
      lines.push(line);
      out.textContent = lines.join('\n');
    }).then(function () {
      setTimeout(function () {
        if (out.dataset.token === token) {
          var all = lines.join(' ');
          if (/EvalError|unsafe-eval|Content Security Policy/i.test(all)) out.textContent = 'หน้านี้ไม่อนุญาตให้รันโค้ดในเบราว์เซอร์ ดูผลลัพธ์ที่เขียนไว้ในคอมเมนต์ของโค้ดแทน';
          else if (!lines.length) out.textContent = '(ไม่มีข้อความจาก console.log)';
        }
        btn.disabled = false;
        btn.textContent = 'รันอีกครั้ง';
      }, 1200);
    });
  }

  function goTo(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  function jumpTo(slug) {
    state.view = 'tools'; state.lec = 'all'; state.q = '';
    document.getElementById('q').value = '';
    render();
    var el = document.getElementById('i-' + slug);
    goTo('i-' + slug);
    if (el) { el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1600); }
  }

  document.getElementById('main').addEventListener('click', function (e) {
    var t = e.target.closest('[data-copy],[data-run],[data-tag],[data-jump]');
    if (!t) return;
    if (t.dataset.copy) copyCode(t.dataset.copy, t);
    else if (t.dataset.run) runBlock(t.dataset.run, t);
    else if (t.dataset.tag) {
      state.q = t.dataset.tag;
      document.getElementById('q').value = state.q;
      render();
      window.scrollTo({ top: 0 });
    } else if (t.dataset.jump) jumpTo(t.dataset.jump);
  });

  document.getElementById('toc').addEventListener('click', function (e) {
    var a = e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    goTo(a.dataset.go);
    if (!window.matchMedia('(min-width: 900px)').matches) document.getElementById('toc').open = false;
  });

  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { state.view = t.dataset.view; render(); });
  });
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { state.lec = c.dataset.lec; render(); });
  });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  document.getElementById('toc').open = window.matchMedia('(min-width: 900px)').matches;
  render();
})();
</script>
