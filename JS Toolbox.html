<title>JS Toolbox CSS233</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky TOC on the left, scannable entries on the right; each entry = short explanation + copyable, runnable code. */
:root {
  --bg: #F3F6F7;
  --surface: #FFFFFF;
  --ink: #13202A;
  --muted: #566673;
  --line: #D6DEE3;
  --line-soft: #E6ECEF;
  --accent: #0A6B5C;
  --accent-soft: #DDF0EB;
  --on-accent: #FFFFFF;
  --l4: #0A6B5C;
  --l5: #A45A00;
  --hw: #5B45B0;
  --l4-soft: #DDF0EB;
  --l5-soft: #FBEBD0;
  --hw-soft: #E8E3F8;
  --code-bg: #EBF0F2;
  --code-ink: #1B2933;
  --out-bg: #14232B;
  --out-ink: #D6E7EE;
  --t-com: #66808E;
  --t-str: #A2420F;
  --t-kw: #7233B0;
  --t-num: #0B6A99;
  --t-lit: #9A5B00;
  --focus: #1D6FE0;
  --flash: #FFF3C4;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1418; --surface: #141D23; --ink: #E3EBEF; --muted: #8CA0AC; --line: #25343D; --line-soft: #1D2A32;
    --accent: #45C4A8; --accent-soft: #12302B; --on-accent: #06201A;
    --l4: #45C4A8; --l5: #E8A648; --hw: #AC97F2;
    --l4-soft: #12302B; --l5-soft: #35260F; --hw-soft: #261F45;
    --code-bg: #0A1115; --code-ink: #D8E4EA; --out-bg: #05090C; --out-ink: #BFE3D6;
    --t-com: #7592A0; --t-str: #E7A27C; --t-kw: #C6A3F4; --t-num: #74C4F0; --t-lit: #E8B560;
    --focus: #6FA8FF; --flash: #3A3216;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1418; --surface: #141D23; --ink: #E3EBEF; --muted: #8CA0AC; --line: #25343D; --line-soft: #1D2A32;
  --accent: #45C4A8; --accent-soft: #12302B; --on-accent: #06201A;
  --l4: #45C4A8; --l5: #E8A648; --hw: #AC97F2;
  --l4-soft: #12302B; --l5-soft: #35260F; --hw-soft: #261F45;
  --code-bg: #0A1115; --code-ink: #D8E4EA; --out-bg: #05090C; --out-ink: #BFE3D6;
  --t-com: #7592A0; --t-str: #E7A27C; --t-kw: #C6A3F4; --t-num: #74C4F0; --t-lit: #E8B560;
  --focus: #6FA8FF; --flash: #3A3216;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  padding-inline: clamp(16px, 4vw, 36px);
  padding-block: 20px 64px;
}
.shell { max-width: 1240px; margin-inline: auto; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }

/* masthead */
.mast { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 18px; }
.brand h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.brand h1 .br { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
.theme { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; white-space: nowrap; }
.theme:hover { border-color: var(--muted); }

/* controls */
.controls { display: grid; gap: 12px; padding-block: 16px; border-block: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.search { position: relative; flex: 1 1 320px; min-width: 0; }
.search input {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.search input::placeholder { color: var(--muted); }
.count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-weight: 500; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 12px; border: 1px solid var(--line); background: transparent; border-radius: 999px; font-size: 0.85rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lead { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 80ch; }

/* layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 44px; padding-top: 24px; }
.layout.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 899px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; } }

.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; font-size: 0.88rem; }
@media (max-width: 899px) { .toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px 12px; } }
.toc summary { cursor: pointer; font-weight: 600; padding-block: 2px; }
.toc-group { margin-top: 14px; }
.toc-group h4 { margin: 0 0 4px; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--accent); }
.toc a span { color: var(--muted); font-variant-numeric: tabular-nums; }

/* sections and entries */
main { min-width: 0; }
.sec { scroll-margin-top: 16px; margin-bottom: 40px; }
.sec-head { display: grid; gap: 4px; padding-bottom: 10px; }
.sec-head h2 { margin: 0; font-size: 1.5rem; line-height: 1.3; text-wrap: balance; }
.sec-head p { margin: 0; color: var(--muted); max-width: 75ch; }
.badge { justify-self: start; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.badge.L4 { color: var(--l4); background: var(--l4-soft); }
.badge.L5 { color: var(--l5); background: var(--l5-soft); }
.badge.HW { color: var(--hw); background: var(--hw-soft); }

.item { border-top: 1px solid var(--line); padding-block: 22px 8px; scroll-margin-top: 16px; min-width: 0; }
.item.flash { animation: none; background: var(--flash); }
.item h3 { margin: 0 0 6px; font-size: 1.1rem; line-height: 1.4; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 10px; }
.tag { border: 0; background: transparent; padding: 0; font: 500 0.75rem var(--font-mono); color: var(--muted); }
.tag:hover { color: var(--accent); text-decoration: underline; }
.prose p, .prose ul { margin: 0 0 10px; max-width: 72ch; }
.prose ul { padding-left: 1.3em; }
.prose li { margin-bottom: 2px; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; margin: 4px 0 12px; max-width: 100%; }
table { border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--font-mono); font-size: 0.82rem; }
th { color: var(--muted); font-weight: 500; }

/* code figure */
.code { margin: 10px 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); overflow: hidden; min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-bottom: 1px solid var(--line); }
.lang { font: 500 0.68rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.acts { display: flex; gap: 4px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 2px 10px; font-size: 0.78rem; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.run { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.run:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.08); }
.btn:disabled { opacity: 0.6; cursor: default; }
pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 400 0.8rem/1.65 var(--font-mono); color: var(--code-ink); tab-size: 2; }
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.out { background: var(--out-bg); color: var(--out-ink); border-top: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow-y: auto; }
.out::before { content: "CONSOLE"; display: block; font-size: 0.62rem; letter-spacing: 0.14em; opacity: 0.6; margin-bottom: 4px; }
.t-com { color: var(--t-com); font-style: italic; }
.t-str { color: var(--t-str); }
.t-kw { color: var(--t-kw); }
.t-num { color: var(--t-num); }
.t-lit { color: var(--t-lit); }

/* problems view */
.prob { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 8px 32px; border-top: 1px solid var(--line); padding-block: 18px 8px; }
@media (max-width: 760px) { .prob { grid-template-columns: minmax(0, 1fr); } }
.prob h3 { margin: 0; font-size: 1rem; line-height: 1.5; text-wrap: balance; }
.prob .badge { margin-bottom: 6px; display: inline-block; }
.prob .ans { margin: 0 0 8px; }
.prob .code { margin-top: 6px; }
.jump { border: 0; background: transparent; padding: 0; color: var(--accent); text-decoration: underline; font-size: 0.86rem; margin-bottom: 8px; text-align: left; }
.empty { padding: 40px 0; color: var(--muted); }
</style>
